name: quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install quality tools
        run: python -m pip install --upgrade coverage ruff
      - name: Run Skill contract smoke check
        run: python -m unittest tests.test_skill_contract
      - name: Run unittest suite
        run: python -m coverage run -m unittest discover -s tests -p 'test*.py'
      - name: Report coverage
        run: python -m coverage report
      - name: Run Ruff
        run: python -m ruff check .agents/skills tests evals scripts

  deterministic-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate benchmark contract
        run: python evals/run_eval.py --validate-only
      - name: Run deterministic task eval
        run: python evals/run_eval.py
      - name: Run release packaging gate
        run: python scripts/release_check.py --json
